name: Update learning journal
on:
  schedule:
    - cron: '30 13 * * *' # 22:30 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-journal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Authenticate to Google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Generate public study summary
        env:
          PMP_SPREADSHEET_ID: ${{ secrets.PMP_SPREADSHEET_ID }}
        run: python scripts/update_journal.py
      - name: Commit changed learning records
        run: |
          git config user.name "togawa0428"
          git config user.email "${{ vars.GIT_COMMIT_EMAIL }}"
          git add README.md data/progress.json logs/
          if git diff --cached --quiet; then
            echo "No study changes; skipping commit."
          else
            git commit -m "docs: update PMP learning progress"
            git push
          fi
